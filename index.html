<!DOCTYPE html>
<html>
<head>
    <title>SKU Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #fffbcb;
            font-family: Arial, Verdana;
        }

        .navbar {
            background-color: #dfb0cbce;
        }

        .navbar a {
            color: rgb(255, 254, 254);
            text-decoration: none;
            margin-left: 20px;
            font-family: Georgia, 'Times New Roman', Times, serif
        }

        .card {
            width: 580px;
            margin: 70px auto;
            border-radius: 15px;
            overflow: hidden;
            color: #cb91b9;
        }

        .card-header {
            background: linear-gradient(90deg, #cc96b6a9, #e495c3a7);
            color: rgb(255, 255, 255);
            text-align: center;
            padding: 30px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .card-body {
            padding: 25px;
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(90deg, #e495c352, #e495c33d);
    
            border: none;
            padding: 12px;
            font-weight: bold;
            color: #eec0e2;
        }

        #sku_output {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            color: #f3c0e0;
        }

        footer {
            background-color: #e5bcd9a1;
            color: rgb(255, 255, 255);
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand">
    <div class="container">
        <a class="navbar-brand text-white fw-bold" href="index.html"> </a>

        <div>
            <a href="index.html">SKU Generator</a>
            <a href="receipt.html">Receipt Generator</a>
        </div>
    </div>
</nav>

<div class="card">

    <div class="card-header">
    
        <h2>SKU Generator .ᐟ.ᐟ</h2>
    </div>

    <div class="card-body">

        <label class="form-label fw-bold">𝒞𝒶𝓉𝑒𝑔𝑜𝓇𝓎 ⋆˚꩜｡</label>

        <select id="category" class="form-select mb-3">
            <option value="Food">Food</option>
            <option value="Drinks">Drinks</option>
            <option value="Pasteries">Pasteries</option>
            <option value="Snacks">Snacks</option>
        </select>


        <label class="form-label fw-bold">𝒫𝓇𝑜𝒹𝓊𝒸𝓉 𝒩𝒶𝓂𝑒 .⋆❀°</label>

        <input type="text"
               id="product_name"
               class="form-control mb-3"
               placeholder="e.g. Pesto pasta">


        <label class="form-label fw-bold">𝒮𝓉𝑜𝒸𝓀 𝒬𝓊𝒶𝓃𝓉𝒾𝓉𝓎 ˚. ᵎᵎ</label>

        <input type="number"
               id="quantity"
               class="form-control mb-3"
               placeholder="e.g. 100">


    

        <button onclick="generateSKU()" class="btn btn-generate">
            ɢᴇɴᴇʀᴀᴛᴇ ꜱᴋᴜ
        
        </button>

        <hr>

        <div id="sku_output">
            ʏᴏᴜʀ ɢᴇɴᴇʀᴀᴛᴇᴅ ꜱᴋᴜ ᴡɪʟʟ ᴀᴘᴘᴇᴀʀ ʜᴇʀᴇ. . ݁₊ ⊹ . ݁˖ . ݁
        
        </div>

    </div>
</div>

<footer>
    SKU Generator 1st Quarter Project
</footer>


<script>
function generateSKU() {

    document.getElementById('sku_output').innerHTML = " ";

    category = document.getElementById('category').value;
    product_name = document.getElementById('product_name').value;
    stock_qty = document.getElementById('quantity').value;

    sku = category.substring(0, 3).toUpperCase() + "-" +
          product_name.substring(0, 4).toUpperCase() + "-" +
          stock_qty;

    document.getElementById('sku_output').innerHTML =
        "SKU: " + sku;
}
</script>

</body>
</html>
